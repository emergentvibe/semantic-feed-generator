# fly.toml app configuration file generated for semantic-feed-generator on 2025-04-16T12:36:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'semantic-feed-generator'
primary_region = 'lhr'

[build]
# No specific builder needed usually, Node buildpack should detect package.json
# It should automatically run "yarn build" if defined in package.json scripts

# Add deploy section for release command
[deploy]
  release_command = "yarn migrate"

[[mounts]]
  source = 'data'
  destination = '/data'

# Define the command for the default 'app' process
[processes]
  app = 'yarn start:prod'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop' # Consider changing to 'off' or 'idle' for a feed generator
  auto_start_machines = true
  min_machines_running = 1 # Ensures at least one machine stays running for the subscription
  processes = ['app'] # Tells http_service to use the 'app' process defined above

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
